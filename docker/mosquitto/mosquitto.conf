# eclipse-mosquitto:2 defaults to binding 127.0.0.1 only and refusing anonymous connections, so
# without this file the broker starts and nothing can reach it from another container.
#
# Anonymous access is on because the oneM2M MQTT binding has no broker-level credentials in
# mobius4: TS-0010 addresses requests by topic, and authorisation is the CSE's <accessControlPolicy>
# resources rather than the broker's. The broker is not published to the host in
# docker-compose.yml, so it is reachable only from the compose network. Publishing it, or pointing
# mobius4 at a broker shared with anything else, means putting real authentication here --
# password_file or TLS with client certificates. docs/docker.md says so too.

listener 1883
allow_anonymous true

# Logs go to stdout so `docker compose logs mosquitto` shows them and the log driver rotates them.
log_dest stdout
log_type error
log_type warning
log_type notice
