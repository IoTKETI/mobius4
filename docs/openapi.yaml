openapi: 3.1.0
info:
  title: mobius4 oneM2M CSE API
  version: 4.4.0
  description: |-
    This document was generated from an observation of mobius4 oneM2M CSE's actual behavior
    via live probing (features/mobius4-capabilities.yaml). Every operation listed here has been
    empirically confirmed as supported; combinations that are unsupported, or for which a defect
    was observed, are not included.

    **The paths are synthesized.** mobius4's actual HTTP routes are only the four wildcards
    `POST|GET|PUT|DELETE /*`; the operation is distinguished by the `ty` parameter of the
    `Content-Type` header and by query parameters. The resource path itself is a dynamic tree the
    user builds, with no fixed structure. Paths shown in this document such as `/{parentPath}` and
    `/{resourcePath}` were invented by the coding agent for readability, and **do not correspond
    1:1 with mobius4's actual routes.** Hiding this fact would mislead anyone who later debugs
    against the real server.
paths:
  /{parentPath}:
    post:
      operationId: createResource
      summary: Create a child resource (CREATE)
      description: >-
        Creates a new resource under the parent resource path. The resource type to create is
        specified via the ty parameter of the Content-Type header (TS-0009:6.4.3).
      parameters:
        - name: parentPath
          in: path
          required: true
          description: >-
            Synthesized path segment — mobius4's actual routes (POST|GET|PUT|DELETE /*) have no
            fixed path under this name.
          schema:
            type: string
        - name: X-M2M-Origin
          in: header
          required: true
          description: Originator identifier of the request (TS-0009:6.4.7)
          schema:
            type: string
        - name: X-M2M-RI
          in: header
          required: true
          description: Request Identifier — used to correlate a request with its response
          schema:
            type: string
        - name: X-M2M-RVI
          in: header
          required: true
          description: Release Version Indicator (TS-0009:6.4.22)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/vnd.onem2m-res+json;ty=1:
            schema:
              $ref: '#/components/schemas/m2m.acp.create.envelope'
          application/vnd.onem2m-res+json;ty=2:
            schema:
              $ref: '#/components/schemas/m2m.ae.create.envelope'
          application/vnd.onem2m-res+json;ty=3:
            schema:
              $ref: '#/components/schemas/m2m.cnt.create.envelope'
          application/vnd.onem2m-res+json;ty=4:
            schema:
              $ref: '#/components/schemas/m2m.cin.create.envelope'
          application/vnd.onem2m-res+json;ty=9:
            schema:
              $ref: '#/components/schemas/m2m.grp.create.envelope'
          application/vnd.onem2m-res+json;ty=23:
            schema:
              $ref: '#/components/schemas/m2m.sub.create.envelope'
      responses:
        '201':
          description: Created
          headers:
            X-M2M-RSC:
              description: >-
                Observed oneM2M Response Status Code (TS-0004) — examples are actual values from
                live probing.
              schema:
                type: integer
              examples:
                acp:
                  value: 2001
                ae:
                  value: 2001
                cnt:
                  value: 2001
                cin:
                  value: 2001
                grp:
                  value: 2001
                sub:
                  value: 2001
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/m2m.acp.envelope'
                  - $ref: '#/components/schemas/m2m.ae.envelope'
                  - $ref: '#/components/schemas/m2m.cnt.envelope'
                  - $ref: '#/components/schemas/m2m.cin.envelope'
                  - $ref: '#/components/schemas/m2m.grp.envelope'
                  - $ref: '#/components/schemas/m2m.sub.envelope'
  /{resourcePath}:
    get:
      operationId: retrieveResource
      summary: Retrieve a resource (RETRIEVE)
      parameters:
        - name: resourcePath
          in: path
          required: true
          description: >-
            Synthesized path segment — mobius4's actual routes (POST|GET|PUT|DELETE /*) have no
            fixed path under this name.
          schema:
            type: string
        - name: X-M2M-Origin
          in: header
          required: true
          description: Originator identifier of the request (TS-0009:6.4.7)
          schema:
            type: string
        - name: X-M2M-RI
          in: header
          required: true
          description: Request Identifier — used to correlate a request with its response
          schema:
            type: string
        - name: X-M2M-RVI
          in: header
          required: true
          description: Release Version Indicator (TS-0009:6.4.22)
          schema:
            type: string
      responses:
        '200':
          description: Retrieved successfully
          headers:
            X-M2M-RSC:
              description: >-
                Observed oneM2M Response Status Code (TS-0004) — examples are actual values from
                live probing.
              schema:
                type: integer
              examples:
                acp:
                  value: 2000
                ae:
                  value: 2000
                cnt:
                  value: 2000
                cin:
                  value: 2000
                cb:
                  value: 2000
                grp:
                  value: 2000
                sub:
                  value: 2000
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/m2m.acp.envelope'
                  - $ref: '#/components/schemas/m2m.ae.envelope'
                  - $ref: '#/components/schemas/m2m.cnt.envelope'
                  - $ref: '#/components/schemas/m2m.cin.envelope'
                  - $ref: '#/components/schemas/m2m.cb.envelope'
                  - $ref: '#/components/schemas/m2m.grp.envelope'
                  - $ref: '#/components/schemas/m2m.sub.envelope'
    put:
      operationId: updateResource
      summary: Update a resource (UPDATE)
      description: >-
        TS-0009:6.4.3 — the Resource Type (ty) parameter exists only on CREATE requests. UPDATE has
        no ty.
      parameters:
        - name: resourcePath
          in: path
          required: true
          description: >-
            Synthesized path segment — mobius4's actual routes (POST|GET|PUT|DELETE /*) have no
            fixed path under this name.
          schema:
            type: string
        - name: X-M2M-Origin
          in: header
          required: true
          description: Originator identifier of the request (TS-0009:6.4.7)
          schema:
            type: string
        - name: X-M2M-RI
          in: header
          required: true
          description: Request Identifier — used to correlate a request with its response
          schema:
            type: string
        - name: X-M2M-RVI
          in: header
          required: true
          description: Release Version Indicator (TS-0009:6.4.22)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/vnd.onem2m-res+json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/m2m.acp.envelope'
                - $ref: '#/components/schemas/m2m.ae.envelope'
                - $ref: '#/components/schemas/m2m.cnt.envelope'
                - $ref: '#/components/schemas/m2m.grp.envelope'
                - $ref: '#/components/schemas/m2m.sub.envelope'
      responses:
        '200':
          description: Updated successfully
          headers:
            X-M2M-RSC:
              description: >-
                Observed oneM2M Response Status Code (TS-0004) — examples are actual values from
                live probing.
              schema:
                type: integer
              examples:
                acp:
                  value: 2004
                ae:
                  value: 2004
                cnt:
                  value: 2004
                grp:
                  value: 2004
                sub:
                  value: 2004
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/m2m.acp.envelope'
                  - $ref: '#/components/schemas/m2m.ae.envelope'
                  - $ref: '#/components/schemas/m2m.cnt.envelope'
                  - $ref: '#/components/schemas/m2m.grp.envelope'
                  - $ref: '#/components/schemas/m2m.sub.envelope'
    delete:
      operationId: deleteResource
      summary: Delete a resource (DELETE)
      parameters:
        - name: resourcePath
          in: path
          required: true
          description: >-
            Synthesized path segment — mobius4's actual routes (POST|GET|PUT|DELETE /*) have no
            fixed path under this name.
          schema:
            type: string
        - name: X-M2M-Origin
          in: header
          required: true
          description: Originator identifier of the request (TS-0009:6.4.7)
          schema:
            type: string
        - name: X-M2M-RI
          in: header
          required: true
          description: Request Identifier — used to correlate a request with its response
          schema:
            type: string
        - name: X-M2M-RVI
          in: header
          required: true
          description: Release Version Indicator (TS-0009:6.4.22)
          schema:
            type: string
      responses:
        '200':
          description: Deleted successfully
          headers:
            X-M2M-RSC:
              description: >-
                Observed oneM2M Response Status Code (TS-0004) — examples are actual values from
                live probing.
              schema:
                type: integer
              examples:
                acp:
                  value: 2002
                ae:
                  value: 2002
                cnt:
                  value: 2002
                cin:
                  value: 2002
                grp:
                  value: 2002
                sub:
                  value: 2002
