openapi: 3.1.0
info:
  title: mobius4 oneM2M CSE API
  version: 4.4.0
  description: |-
    이 문서는 mobius4 oneM2M CSE의 실제 동작을 라이브 프로브로 관찰한 결과(features/mobius4-capabilities.yaml)에
    근거해 생성되었다. 여기 실린 오퍼레이션은 전부 실측으로 지원이 확인된 것만이며, 미지원이거나
    결함(defect)이 관찰된 조합은 싣지 않는다.

    **경로는 합성형(synthesized)이다.** mobius4의 실제 HTTP 라우트는 `POST|GET|PUT|DELETE /*`
    네 개의 와일드카드뿐이고, 오퍼레이션은 `Content-Type`의 `ty` 파라미터와 쿼리 파라미터로
    구분된다. 리소스 경로 자체도 사용자가 만드는 동적 트리라 고정된 구조가 없다. 이 문서가 보여주는
    `/{parentPath}`, `/{resourcePath}` 같은 경로는 코딩 에이전트가 읽기 쉽도록 지어낸 것으로,
    **mobius4의 실제 라우트와 1:1로 대응하지 않는다.** 이 사실을 감추면 나중에 실제 서버를 두고
    디버깅하는 사람을 오도하게 된다.
paths:
  /{parentPath}:
    post:
      operationId: createResource
      summary: 자식 리소스 생성 (CREATE)
      description: 부모 리소스 경로 아래 새 리소스를 생성한다. 생성할 리소스 타입은 Content-Type의 ty 파라미터로 지정한다(TS-0009:6.4.3).
      parameters:
        - name: parentPath
          in: path
          required: true
          description: 합성 경로 세그먼트 — mobius4의 실제 라우트(POST|GET|PUT|DELETE /*)에는 이 이름의 고정 경로가 없다.
          schema:
            type: string
        - name: X-M2M-Origin
          in: header
          required: true
          description: 요청 오리지네이터(Originator) 식별자 (TS-0009:6.4.7)
          schema:
            type: string
        - name: X-M2M-RI
          in: header
          required: true
          description: 요청 식별자(Request Identifier) — 요청-응답 짝을 맞추는 데 쓰인다
          schema:
            type: string
        - name: X-M2M-RVI
          in: header
          required: true
          description: 릴리즈 버전 지시자(Release Version Indicator, TS-0009:6.4.22)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/vnd.onem2m-res+json;ty=1:
            schema:
              $ref: '#/components/schemas/m2m.acp.create'
          application/vnd.onem2m-res+json;ty=2:
            schema:
              $ref: '#/components/schemas/m2m.ae.create'
          application/vnd.onem2m-res+json;ty=3:
            schema:
              $ref: '#/components/schemas/m2m.cnt.create'
          application/vnd.onem2m-res+json;ty=4:
            schema:
              $ref: '#/components/schemas/m2m.cin.create'
          application/vnd.onem2m-res+json;ty=9:
            schema:
              $ref: '#/components/schemas/m2m.grp.create'
          application/vnd.onem2m-res+json;ty=23:
            schema:
              $ref: '#/components/schemas/m2m.sub.create'
      responses:
        '201':
          description: 생성됨
          headers:
            X-M2M-RSC:
              description: 관찰된 oneM2M Response Status Code (TS-0004) — 예시는 라이브 프로브 실측값이다.
              schema:
                type: integer
              examples:
                acp:
                  value: 2001
                ae:
                  value: 2001
                cnt:
                  value: 2001
                cin:
                  value: 2001
                grp:
                  value: 2001
                sub:
                  value: 2001
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/m2m.acp'
                  - $ref: '#/components/schemas/m2m.ae'
                  - $ref: '#/components/schemas/m2m.cnt'
                  - $ref: '#/components/schemas/m2m.cin'
                  - $ref: '#/components/schemas/m2m.grp'
                  - $ref: '#/components/schemas/m2m.sub'
  /{resourcePath}:
    get:
      operationId: retrieveResource
      summary: 리소스 조회 (RETRIEVE)
      parameters:
        - name: resourcePath
          in: path
          required: true
          description: 합성 경로 세그먼트 — mobius4의 실제 라우트(POST|GET|PUT|DELETE /*)에는 이 이름의 고정 경로가 없다.
          schema:
            type: string
        - name: X-M2M-Origin
          in: header
          required: true
          description: 요청 오리지네이터(Originator) 식별자 (TS-0009:6.4.7)
          schema:
            type: string
        - name: X-M2M-RI
          in: header
          required: true
          description: 요청 식별자(Request Identifier) — 요청-응답 짝을 맞추는 데 쓰인다
          schema:
            type: string
        - name: X-M2M-RVI
          in: header
          required: true
          description: 릴리즈 버전 지시자(Release Version Indicator, TS-0009:6.4.22)
          schema:
            type: string
      responses:
        '200':
          description: 조회 성공
          headers:
            X-M2M-RSC:
              description: 관찰된 oneM2M Response Status Code (TS-0004) — 예시는 라이브 프로브 실측값이다.
              schema:
                type: integer
              examples:
                acp:
                  value: 2000
                ae:
                  value: 2000
                cnt:
                  value: 2000
                cin:
                  value: 2000
                cb:
                  value: 2000
                grp:
                  value: 2000
                sub:
                  value: 2000
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/m2m.acp'
                  - $ref: '#/components/schemas/m2m.ae'
                  - $ref: '#/components/schemas/m2m.cnt'
                  - $ref: '#/components/schemas/m2m.cin'
                  - $ref: '#/components/schemas/m2m.cb'
                  - $ref: '#/components/schemas/m2m.grp'
                  - $ref: '#/components/schemas/m2m.sub'
    put:
      operationId: updateResource
      summary: 리소스 갱신 (UPDATE)
      description: TS-0009:6.4.3 — Resource Type(ty) 파라미터는 CREATE 요청에만 있다. UPDATE에는 ty가 없다.
      parameters:
        - name: resourcePath
          in: path
          required: true
          description: 합성 경로 세그먼트 — mobius4의 실제 라우트(POST|GET|PUT|DELETE /*)에는 이 이름의 고정 경로가 없다.
          schema:
            type: string
        - name: X-M2M-Origin
          in: header
          required: true
          description: 요청 오리지네이터(Originator) 식별자 (TS-0009:6.4.7)
          schema:
            type: string
        - name: X-M2M-RI
          in: header
          required: true
          description: 요청 식별자(Request Identifier) — 요청-응답 짝을 맞추는 데 쓰인다
          schema:
            type: string
        - name: X-M2M-RVI
          in: header
          required: true
          description: 릴리즈 버전 지시자(Release Version Indicator, TS-0009:6.4.22)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/vnd.onem2m-res+json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/m2m.acp'
                - $ref: '#/components/schemas/m2m.ae'
                - $ref: '#/components/schemas/m2m.cnt'
                - $ref: '#/components/schemas/m2m.grp'
                - $ref: '#/components/schemas/m2m.sub'
      responses:
        '200':
          description: 갱신 성공
          headers:
            X-M2M-RSC:
              description: 관찰된 oneM2M Response Status Code (TS-0004) — 예시는 라이브 프로브 실측값이다.
              schema:
                type: integer
              examples:
                acp:
                  value: 2004
                ae:
                  value: 2004
                cnt:
                  value: 2004
                grp:
                  value: 2004
                sub:
                  value: 2004
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/m2m.acp'
                  - $ref: '#/components/schemas/m2m.ae'
                  - $ref: '#/components/schemas/m2m.cnt'
                  - $ref: '#/components/schemas/m2m.grp'
                  - $ref: '#/components/schemas/m2m.sub'
    delete:
      operationId: deleteResource
      summary: 리소스 삭제 (DELETE)
      parameters:
        - name: resourcePath
          in: path
          required: true
          description: 합성 경로 세그먼트 — mobius4의 실제 라우트(POST|GET|PUT|DELETE /*)에는 이 이름의 고정 경로가 없다.
          schema:
            type: string
        - name: X-M2M-Origin
          in: header
          required: true
          description: 요청 오리지네이터(Originator) 식별자 (TS-0009:6.4.7)
          schema:
            type: string
        - name: X-M2M-RI
          in: header
          required: true
          description: 요청 식별자(Request Identifier) — 요청-응답 짝을 맞추는 데 쓰인다
          schema:
            type: string
        - name: X-M2M-RVI
          in: header
          required: true
          description: 릴리즈 버전 지시자(Release Version Indicator, TS-0009:6.4.22)
          schema:
            type: string
      responses:
        '200':
          description: 삭제 성공
          headers:
            X-M2M-RSC:
              description: 관찰된 oneM2M Response Status Code (TS-0004) — 예시는 라이브 프로브 실측값이다.
              schema:
                type: integer
              examples:
                acp:
                  value: 2002
                ae:
                  value: 2002
                cnt:
                  value: 2002
                cin:
                  value: 2002
                grp:
                  value: 2002
                sub:
                  value: 2002
