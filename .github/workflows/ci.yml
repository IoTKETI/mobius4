name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      # Even if one version breaks, we still want the full results for the others.
      fail-fast: false
      matrix:
        node: ['22', '24']

    services:
      postgres:
        # The official postgres image can't be used because the PostGIS extension is required.
        # The tag matches the development environment (PostgreSQL 17.4 / PostGIS 3.6.4).
        # PG 17 with PostGIS 3.6 is only published for alpine. The base distro has no
        # effect on the tests — they only query the DB over TCP; only the PostgreSQL major / PostGIS minor matter.
        image: postgis/postgis:17-3.6-alpine
        env:
          POSTGRES_USER: mobius
          POSTGRES_PASSWORD: mobius
          # The image's initdb script pre-enables the PostGIS extension on this DB.
          # The name must match the TEST_DB constant at test/helpers/server.js:14.
          POSTGRES_DB: mobius4_test
        ports:
          - 5432:5432
        # Without a health check there is a race where the next step runs before the DB is up.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      # cache: npm must be spelled out — since setup-node v5, automatic caching is enabled only
      # when package.json has a packageManager field. This project has none, so it is mandatory.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # config/local*.json is gitignored, so it does not exist on the runner.
      # db.user and db.pw in config/default.json are empty strings, so they must be filled in here.
      #
      # Why this cannot be injected through the NODE_CONFIG environment variable:
      # when test/helpers/server.js spawns a child process it overwrites NODE_CONFIG wholesale
      # with its own value (http, https, db.name, mqtt, logging). A NODE_CONFIG set from the
      # outside never reaches the child. node-config, by contrast, deep-merges NODE_CONFIG on
      # top of the file config, so local.json's db.user/db.pw survive and only db.name is overridden.
      - name: Write CI database credentials
        run: |
          cat > config/local.json <<'JSON'
          {
            "db": {
              "user": "mobius",
              "pw": "mobius",
              "host": "localhost",
              "port": 5432
            }
          }
          JSON

      # npm ci, not npm install. It installs only the versions pinned in the lockfile, so it is
      # reproducible, and it fails immediately if package.json and package-lock.json disagree.
      - name: Install dependencies
        run: npm ci

      # The MQTT tests start their own broker on a free port; only the binary needs to exist.
      - name: Install mosquitto
        run: sudo apt-get update && sudo apt-get install -y mosquitto

      # Why shell: bash is spelled out — the default GitHub Actions shell does not set pipefail.
      # Under that shell, `npm test | tee` lets tee's exit code (0) become the step's result
      # even when npm test fails, which hides the failure.
      - name: Run tests
        shell: bash
        run: npm test 2>&1 | tee test-output.txt

      # This step is a gate, not a report — if either of the two conditions below is
      # violated, it fails the job.
      - name: Assert test baseline (# tests) + known defects
        if: always()
        shell: bash
        run: |
          # A missing test-output.txt means an earlier step (npm ci, or npm test itself) failed
          # before it could leave any output. Screen for that here first, so it is not
          # mistaken for "no TODO-marked tests" and waved through silently.
          if [ ! -f test-output.txt ]; then
            echo "::error::test-output.txt is missing — the test step appears to have failed before leaving any output."
            exit 1
          fi

          # Even when an empty glob matches zero tests, `node --test` reports `# tests 0 / # fail 0`
          # and exits 0 — so if test/ is moved or deleted, or package.json's glob is changed
          # incorrectly, the `Run tests` step is still green. Hence we count the tests that actually
          # ran and compare against this repo's regression baseline (61 = 36 from v4.4.0 + 19 for
          # <flexContainer> + 6 for MQTT binding coverage).
          # grep -oP is PCRE and absent from macOS's default (BSD) grep, so awk extracts it portably.
          TEST_COUNT=$(awk '/^# tests /{print $3}' test-output.txt | tail -n1)
          BASELINE=61

          if [ -z "$TEST_COUNT" ]; then
            echo "::error::No '# tests N' line was found in test-output.txt — this does not look like tap reporter output."
            exit 1
          fi

          # `[ ... -lt ... ]` raises an error (exit code 2) rather than returning false when an
          # operand is not an integer or exceeds bash's signed 64-bit range. That error occurs
          # inside an if condition, so set -e does not catch it: the failure branch is skipped
          # and the gate passes wide open. So we verify two things ourselves right before the
          # comparison: (1) digits only (no newline or CR), (2) at most nine digits (guaranteeing
          # safety within bash's range).
          if ! [[ "$TEST_COUNT" =~ ^[0-9]{1,9}$ ]]; then
            echo "::error::The '# tests' value in test-output.txt is not an integer: '${TEST_COUNT}'"
            exit 1
          fi

          if [ "$TEST_COUNT" -lt "$BASELINE" ]; then
            echo "::error::Test count is ${TEST_COUNT}, below the baseline of ${BASELINE} — test/ may have been moved or deleted, or package.json's glob changed, leaving some tests unrun."
            exit 1
          fi
          echo "Test count check: ${TEST_COUNT} (baseline is ${BASELINE} or more)"

          # Known unfixed defects marked as todo exit 0 even when they fail.
          # Always log their current state so a green build does not hide the remaining defects.
          # This does not fail the job. If `ok … # TODO` shows up, that defect has been resolved,
          # so drop the { todo: true } flag from that test and promote it to a real regression test.
          echo "── Known unfixed defects ──"
          grep -E '# TODO' test-output.txt || echo "(no TODO-marked tests)"
